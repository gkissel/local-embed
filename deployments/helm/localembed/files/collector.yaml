receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
extensions:
  file_storage:
    directory: /data/collector-queue
    create_directory: true
    fsync: true
    max_size: 67108864
  health_check:
    endpoint: 0.0.0.0:13133
    path: /ready
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  filter/localembed:
    error_mode: ignore
    traces:
      span:
        - 'instrumentation_scope.name != "localembed"'
    metrics:
      metric:
        - 'instrumentation_scope.name != "localembed"'
    logs:
      log_record:
        - 'not IsMatch(body, "^\\{\\\"event\\\":")'
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024
exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    sending_queue:
      enabled: true
      queue_size: 256
      num_consumers: 2
      storage: file_storage
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
    sending_queue:
      enabled: true
      queue_size: 256
      num_consumers: 2
      storage: file_storage
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
    sending_queue:
      enabled: true
      queue_size: 256
      num_consumers: 2
      storage: file_storage
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
service:
  extensions: [health_check, file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/localembed, batch]
      exporters: [otlp_http/traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/localembed, batch]
      exporters: [otlp_http/metrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/localembed, batch]
      exporters: [otlp_http/logs]
